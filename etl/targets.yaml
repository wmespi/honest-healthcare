# Target plans: the plans this project is trying to price.
#
# `etl parse` selects a pending file because the master index says that file
# prices one of these plans (the index_file_plans link `etl discover` writes),
# not because of what its filename looks like. Add a target here and the next
# `make parse` picks up its files; nothing else has to change.
#
#   exchange_networks  Network IDs from Georgia's exchange plan file, issuer and
#                      network ("45334-GAN001"; reference/exchange-plans.md).
#                      Every plan on them is a target plan, so a file is parsed
#                      when it prices a plan someone can buy on one of them.
#                      `make reference STEP=exchange-plans` has to have run.
#
# A second list says what the plan's rates should *look like* once a selected
# file is opened:
#
#   network_patterns   The `provider_references[].network_name` labels this
#                      plan's rates carry, `*`-wildcarded, case-insensitive.
#                      This is the parse probe's network signal (etl/parse.md
#                      "The provider probe"), not a row filter: a file the index
#                      links to the plan but whose provider_references carry
#                      none of these labels is abandoned before `in_network` is
#                      read, and marked `skipped`. Every network in a file that
#                      passes is written; the build step selects.
#                      Omit it and that file is streamed in full.
#
# See etl/discover.md (how the plan→file link is captured) and etl/parse.md (how
# it is selected on, and what the probe does with network_patterns).

targets:
  - name: Anthem Blue Value
    # The primary use case (AGENTS.md): Anthem's individual HMOs on the Blue
    # Value network in Georgia, 8 plans in 2026. Their rates carry the network
    # label "GA Blue Value HIX Individual Network". The index also links them to
    # about 250 national BlueCard-mirror shards, which list Georgia NPIs too, so
    # provider overlap alone waves them through; they were ~40 GB of download
    # that ended in a rollback. The label is what stops them at the front of the
    # stream.
    exchange_networks:
      - "45334-GAN001"
    network_patterns:
      - "GA Blue Value HIX*"

  - name: Anthem Pathway PCP Copay Choice
    # A second Georgia individual network, so the plan picker has a real choice.
    # Same index shape as Blue Value: the label is what finds the file.
    exchange_networks:
      - "49046-GAN008"
    network_patterns:
      - "Pathway PCP Copay Choice*"
