# Target plans — the plans this project is trying to price.
#
# `etl parse` selects a pending file because the master index says that file
# serves one of these plans (the index_file_plans link `etl discover` writes),
# not because of what its filename looks like. Add a plan here and the next
# `make parse` picks up its files; nothing else has to change.
#
# A file matches a target when ANY of that target's patterns matches ANY of the
# plans the index links to the file:
#
#   plan_name_patterns  Case-insensitive match against the index's free-text
#                       `plan_name`. `*` is a wildcard, so "*blue value*" is a
#                       substring match; a pattern with no `*` is an exact
#                       (case-insensitive) match.
#   plan_id_prefixes    Literal prefix of the HIOS `plan_id`. HIOS ids are
#                       positional — [0:5] is the issuer, [5:7] the 2-letter
#                       state — so "45334GA" reads as "this issuer's Georgia
#                       plans".
#
# Both lists are optional, but a target with neither matches nothing.
#
# A third, separate list says what the plan's rates should *look like* once a
# selected file is opened:
#
#   network_patterns    The `provider_references[].network_name` labels this
#                       plan's rates carry, `*`-wildcarded, case-insensitive.
#                       This is the parse probe's network signal (etl/parse.md
#                       "The provider probe"), not a row filter: a file the index
#                       links to the plan but whose provider_references carry
#                       none of these labels is abandoned before `in_network` is
#                       read, and marked `skipped`. Every network in a file that
#                       passes is written; the build step selects.
#                       Omit it and that file is streamed in full.
#
# See etl/discover.md (how the plan→file link is captured) and etl/parse.md (how
# it is selected on, and what the probe does with network_patterns).

targets:
  - name: BLUE VALUE IND NETWORK HMO - INDIV - ANTHEM
    # The primary use case (AGENTS.md) — an individual HMO on Anthem's Blue
    # Value network in Georgia. Its rates carry the structured network_name
    # "GA Blue Value HIX Individual Network".
    plan_name_patterns:
      - "*blue value*"
    # The index links this plan to ~245 files; one of them actually carries its
    # network. The rest are national BlueCard-mirror shards — they do list
    # Georgia NPIs, so provider overlap alone waves them through, and they were
    # ~40 GB of download that ended in a rollback. This pattern is what stops
    # them at the front of the stream.
    network_patterns:
      - "GA Blue Value HIX*"
