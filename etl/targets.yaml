# Target plans: the plans this project is trying to price.
#
# `etl parse` downloads only the files named here. The master index links each
# plan to many more files than the one that prices it, and none of those is
# downloaded, even when it hasn't been parsed yet.
#
#   exchange_networks  Network IDs from Georgia's exchange plan file, issuer and
#                      network ("45334-GAN001"; reference/exchange-plans.md).
#                      Every plan on them is a target plan.
#                      `make reference STEP=exchange-plans` has to have run.
#
#   files              The insurer files that price those plans, each by the
#                      last part of its index location, without the query
#                      ("GA_JBNKMED0001.json.gz"). Parse stops unless the index
#                      links each one to a plan on the target's networks (the
#                      index_file_plans link `etl discover` writes), so a file
#                      that prices only a plan no longer sold can't be named by
#                      mistake.
#
# A third list says what the plan's rates should *look like* once a named file
# is opened:
#
#   network_patterns   The `provider_references[].network_name` labels this
#                      plan's rates carry, `*`-wildcarded, case-insensitive.
#                      This is the parse probe's network signal (etl/parse.md
#                      "The provider probe"), not a row filter: a named file
#                      whose provider_references carry none of these labels is
#                      abandoned before `in_network` is read, and marked
#                      `skipped`. Every network in a file that passes is
#                      written, and parse publishes only these labels' rates.
#                      Omit it and that file is streamed in full.
#                      Parse's last step prices each exchange network with the
#                      rates under these labels, and stops unless exactly one
#                      parsed file the index links to the network's plans
#                      carries them (etl/parse.md).
#
# See etl/discover.md (how the plan→file link is captured) and etl/parse.md (how
# parse selects and checks the named files).

targets:
  - name: Anthem Blue Value
    # The primary use case (AGENTS.md): Anthem's individual HMOs on the Blue
    # Value network in Georgia. Their rates carry the network label
    # "GA Blue Value HIX Individual Network". The index also links them to
    # about 250 out-of-state BlueCard shards, which list Georgia NPIs too; they
    # were ~40 GB of download that ended in a rollback, so they aren't named.
    exchange_networks:
      - "45334-GAN001"
    files:
      - "GA_JBNKMED0001.json.gz"
    network_patterns:
      - "GA Blue Value HIX*"

  - name: Anthem Pathway PCP Copay Choice
    # A second Georgia individual network, so the plan picker has a real choice.
    # Same index shape as Blue Value.
    exchange_networks:
      - "49046-GAN008"
    files:
      - "GA_JBLDMEDTR01.json.gz"
    network_patterns:
      - "Pathway PCP Copay Choice*"
