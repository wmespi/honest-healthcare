# What the payer and plan names in hospitals' own price files mean
# (integration/inputs/hospital_plans.py, integration/build.md).
#
# A hospital's own file names each rate's payer and plan in its own words, so the
# build prices a hospital's own fee from it only under a name someone has read
# and said is a plan on one of the exchange networks we price. It does so only
# where the plan's own file prices no fee at that hospital.
#
# Each group lists the hospitals (CCNs) whose files use the same names, the names
# that mean each network, by Georgia's network ID, and under `other` the names
# read and found to be something else, such as Medicare Advantage, Medicaid, an
# employer plan or another state's Blue Cross, or that don't say which plan they
# mean, such as an exchange name that doesn't say Pathway, or one of two names for
# a plan that give different fees:
#
#   - hospitals: ["110010", "110078"]
#     networks:
#       49046-GAN008: ["ANTHEM BLUE CROSS | PATHWAY X HMO"]
#     other: ["ANTHEM BLUE CROSS | MEDICARE ADVANTAGE"]
#
# A name is "<payer> | <plan>", exactly as the file gives them, and "<payer> |"
# when it gives no plan. A name can mean several networks, and counts on a
# network only at a hospital that network's own file lists, since a file names a
# payer's plan, not which of its networks. The build stops on a name a hospital's
# file uses that its group doesn't list, on a hospital in two groups, a name
# listed twice for one hospital and network or both under a network and under
# `other`, and on a network the payer rates don't list.
#
# Hospitals' files name Anthem's Pathway plans without saying which of its three
# Pathway networks, and the three networks' own files give the same hospital fees
# (49046-GAN003 on every service and hospital they share with 49046-GAN008,
# 49046-GAN001 on all but a few), so each Pathway name means all three. A name
# that says Pathway along with another plan, such as "HMO/Pathway X", means them.
#
# Hospitals' files name Ambetter's exchange plan without saying which of its five
# networks, and where Ambetter's own file prices a hospital's fee on several of
# them it gives the same fee, so each Ambetter name means all five. Peach State
# Health Plan's only commercial plan in Georgia is Ambetter.
#
# No hospital's file names a plan on Blue Value's exchange network (45334-GAN001).

