    49046-GAN008: ["BLUE CROSS ANTHEM PATHWAY GEORGIA  [11103] | Anthem Pathway"]
  other:
    - "BLUE CROSS MEDICARE [30101] | BCBS Medicare Advantage Georgia"
    - "BLUE CROSS [10001] | Blue Cross HMO"
    - "BLUE CROSS [10001] | Blue Cross PPO"

# Piedmont Augusta, which also contracts with South Carolina's Blue Cross
