    - "BLUE CROSS [10001] | BCBS South Carolina SHP"
    - "BLUE CROSS [10001] | Blue Cross HMO"
    - "BLUE CROSS [10001] | Blue Cross PPO"
    - "BLUE CROSS [10001] | Blue Cross South Carolina"

