# The kinds of doctor someone can pick for a family that sets `asks_specialty`
# in integration/families.yaml (an office visit is one code whatever the
# doctor's specialty), in the order the screen lists them. `make build` reads it
# (integration/build.md). Each has:
#   specialty   Our key for it.
#   name        What the screen calls it.
#   benefit     What the member's share for a visit falls under: `primary_care`
#               or `specialist`, a benefit families.yaml declares.
#   taxonomies  The NUCC codes (NPPES primary specialty) of a clinician who counts.
#               A code is in at most one kind, and one in no kind (a nurse
#               practitioner or physician assistant with no specialization, an
#               emergency doctor, an anesthesiologist, a radiologist, a
#               hospitalist) is someone to book a visit with in none of them.
#               An organization's code counts the same way, for a row whose
#               clinicians give no kind: a clinic or center that names one kind
#               is listed, and a multi-specialty or single-specialty group is not.
specialties:
  - specialty: primary_care
    name: Primary care
    benefit: primary_care
    taxonomies:
      - "207Q00000X"  # Family Medicine
      - "207R00000X"  # Internal Medicine
