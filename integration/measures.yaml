    subject: clinician
    source: clinician-volume
    unit: procedures
    category: Hernia repair - groin (open)
    fits:
      - family: other_procedures
        services: [surgery-hernia-groin-open]
  - measure: volume-hysterectomy
    name: Hysterectomies this doctor has done
