    unit: procedures
    category: Varicose vein removal
    fits:
      - family: other_procedures
        services: [surgery-vein-injection, surgery-vein-radiofrequency, surgery-vein-laser]
  - measure: OP-10
    name: Abdomen CT scans done with and without contrast
    about: The share of outpatient abdomen CT scans done both with and without contrast dye, which means extra radiation, so lower is better.
    subject: place
    source: hospital-measures
    unit: percent
    fits:
      - family: ct
  - measure: OP-39
    name: Screening mammograms that call the patient back
    about: The share of screening mammograms where the patient is called back for more imaging, which is common and normally somewhere between 5 and 12 percent.
    subject: place
    source: hospital-measures
    unit: percent
    fits:
