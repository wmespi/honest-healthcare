version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: honest-healthcare-db
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c log_min_messages=warning
      -c log_checkpoints=off
    environment:
      - POSTGRES_DB=honest_healthcare
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data-test:/data-test
      - ./data:/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  etl_go:
    build:
      context: .
      dockerfile: deploy/Dockerfile.etl_go
    container_name: honest-healthcare-etl-go
    command: tail -f /dev/null
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/honest_healthcare?sslmode=disable
      - TEST_DATABASE_URL=postgres://postgres:postgres@db:5432/honest_healthcare?sslmode=disable&search_path=test
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: honest-healthcare-backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/honest_healthcare
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: honest-healthcare-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Uncomment the command below for Live Development (Vite HMR)
    # command: sh -c "cd /app && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:80"
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
