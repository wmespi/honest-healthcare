# Dev stack. Every service builds from a multi-stage Dockerfile in deploy/ whose
# default target is the production artifact; here we select the `dev` target and
# layer on the dev-loop conveniences (bind-mounted source, exposed ports,
# --reload, persistent build caches). A deployable compose file lands with #17.
#
# Multi-stack (GH #59): container names are unset so the project name
# (COMPOSE_PROJECT_NAME, default = directory name) scopes everything, and the
# host ports + data root are env-driven. Copy .env.example → .env in a worktree
# to run a second stack alongside the canonical one; see docs/worktrees.md.
# With no .env this behaves exactly as before (project `honest-healthcare`,
# ports 5432/8000/5173, ./data).
services:
  db:
    image: postgis/postgis:15-3.3-alpine
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c log_min_messages=warning
      -c log_checkpoints=off
    environment:
      - POSTGRES_DB=honest_healthcare
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: .
      dockerfile: deploy/Dockerfile.etl
      target: dev
    init: true
    command: tail -f /dev/null
    mem_limit: 6g
    volumes:
      - .:/app
      # Parquet store — this worktree's ./data by default; point HH_DATA_ROOT at
      # the canonical checkout's data/ to read a shared store. ETL that *writes*
      # (parse/discover) should leave this unset or use TEST=1.
      - ${HH_DATA_ROOT:-./data}:/app/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/honest_healthcare?sslmode=disable
      - TEST_DATABASE_URL=postgres://postgres:postgres@db:5432/honest_healthcare?sslmode=disable&search_path=test
      # Sub-store split (GH #59 Part C) — empty unless a worktree is rebuilding
      # reference/CMS/summary parquet; code falls back to DATA_DIR subdirs.
      # data-local/ is already at /app/data-local via the repo mount.
      - ANTHEM_DIR=${ANTHEM_DIR:-}
      - NPPES_DIR=${NPPES_DIR:-}
      - REFERENCE_DIR=${REFERENCE_DIR:-}
      - CMS_DIR=${CMS_DIR:-}
      - SUMMARY_DIR=${SUMMARY_DIR:-}
    depends_on:
      db:
        condition: service_healthy

  serving:
    build:
      context: .
      dockerfile: deploy/Dockerfile.serving
    # image default is a prod server; --reload + the source mount are dev-only
    command: uvicorn serving.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ${HH_DATA_ROOT:-./data}:/app/data
    ports:
      # loopback by default — remote access is via `tailscale serve`
      # (scripts/tailscale-up.sh), which proxies 127.0.0.1:$API_PORT, and a 0.0.0.0
      # bind would clash with tailscaled. BIND_HOST=0.0.0.0 opts a non-tailnet
      # stack (e.g. `make preview LAN=1`) into plain-LAN access.
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      - DATA_DIR=/app/data
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-4GB}
      - DUCKDB_TMP=${DUCKDB_TMP:-/tmp/duckdb_spill}
      # Sub-store split (GH #59 Part C) — see the etl service note.
      - ANTHEM_DIR=${ANTHEM_DIR:-}
      - NPPES_DIR=${NPPES_DIR:-}
      - REFERENCE_DIR=${REFERENCE_DIR:-}
      - CMS_DIR=${CMS_DIR:-}
      - SUMMARY_DIR=${SUMMARY_DIR:-}

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # loopback by default — see the serving note; BIND_HOST=0.0.0.0 for LAN preview
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    environment:
      # By default the frontend derives the API URL from window.location at
      # runtime (src/api.js), so http://<any-host>:5173 just works — LAN IP,
      # Tailscale name, localhost. Set VITE_API_URL for a split deployment, or
      # when this stack's API_PORT isn't 8000 (a second stack — see .env.example).
      - VITE_API_URL=${VITE_API_URL:-}
    depends_on:
      - serving

volumes:
  postgres_data:
  go-mod-cache:
  go-build-cache:
