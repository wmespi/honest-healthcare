services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: honest-healthcare-db
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c log_min_messages=warning
      -c log_checkpoints=off
    environment:
      - POSTGRES_DB=honest_healthcare
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data-test:/data-test
      - ./data:/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: .
      dockerfile: deploy/Dockerfile.etl
    container_name: honest-healthcare-etl
    init: true
    command: tail -f /dev/null
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/honest_healthcare?sslmode=disable
      - TEST_DATABASE_URL=postgres://postgres:postgres@db:5432/honest_healthcare?sslmode=disable&search_path=test
    depends_on:
      db:
        condition: service_healthy

  serving:
    build:
      context: .
      dockerfile: deploy/Dockerfile.serving
    container_name: honest-healthcare-serving
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      target: dev
    container_name: honest-healthcare-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # By default the frontend derives the API URL from window.location at
      # runtime (src/api.js), so http://<any-host>:5173 just works — LAN IP,
      # Tailscale name, localhost. Only set VITE_API_URL for a split deployment
      # where the API lives on a different host.
      - VITE_API_URL=${VITE_API_URL:-}
    depends_on:
      - serving

volumes:
  postgres_data:
