# Target plans: the plans this project is trying to price.
#
# `etl parse` downloads only the files named here. A payer's master index links
# each plan to many more files than the one that prices it, and none of those is
# downloaded, even when it hasn't been parsed yet.
#
#   payer              The insurer whose index lists the files and whose rate
#                      files they are: `anthem`, `ambetter`, `alliant` or `oscar` (core.Payers).
#                      Required. Its files are kept in data/raw/<payer>/, and its
#                      networks' rates are published under
#                      data/ingestion/payer_rates/<payer>/.
#
#   exchange_networks  Network IDs from Georgia's exchange plan file, issuer and
#                      network ("45334-GAN001"; ingestion/reference/exchange-plans.md).
#                      Every plan on them is a target plan.
#                      `make reference STEP=exchange-plans` has to have run.
#
#   files              The insurer files that price those plans, each by the
#                      last part of its index location, without the query
#                      ("GA_JBNKMED0001.json.gz"). A `*` stands for any run of
#                      characters, for a name with a date in it
#                      ("*_ambetter-ga_in-network.json"). A name has to match
#                      exactly one file in the payer's index this month. Parse
#                      stops unless the index links each one to a plan on the
#                      target's networks (the index_file_plans link `etl
#                      discover` writes, by plan ID or by the product ID, the
#                      first 10 characters of it, which Ambetter lists; a plan ID
#                      with a two-digit variant after it is the same plan), so a
#                      file that prices only a plan no longer sold can't be named
#                      by mistake. Targets may name one file, and it is read
#                      once. When this month's file of a `*` name is parsed, the
#                      earlier month's Parquet and parse record are deleted.
#
# A third list says what the plan's rates should *look like* once a named file
# is opened:
#
#   network_patterns   The `provider_references[].network_name` labels this
#                      plan's rates carry, `*`-wildcarded, case-insensitive.
#                      This is the parse probe's network signal (ingestion/etl/parse.md
#                      "The provider probe"), not a row filter: a named file
#                      whose provider_references carry none of these labels is
#                      abandoned before `in_network` is read, and marked
#                      `skipped`. Every network in a file that passes is
#                      written, and parse publishes only these labels' rates.
#                      Omit it and that file is streamed in full. A label that
#                      one file shares with other networks, such as Ambetter's,
#                      is written exactly ("Exchange GA"): the matching is a
#                      whole-label match unless there is a `*`.
#                      Parse's last step prices each exchange network with the
#                      rates under these labels in the one parsed file of
#                      `files` the index links to the network's plans, and
#                      leaves out, with a warning, a network none of them
#                      prices yet (ingestion/etl/parse.md).
#
#   shared_patterns    Other labels in the same file that price this plan's
#                      members without its name, such as Anthem's exchange-wide
#                      labels. Their rates are published under the network with
#                      `own_label` false, and the build shows one only where the
#                      plan's own labels have no rate for the biller, service and
#                      bill. They count only in a file that carries one of
#                      `network_patterns`. Optional.
#
# See ingestion/etl/discover.md (how the plan→file link is captured) and ingestion/etl/parse.md (how
# parse selects and checks the named files).

targets:
  - name: Anthem Blue Value
    payer: anthem
    # The primary use case (AGENTS.md): Anthem's individual HMOs on the Blue
    # Value network in Georgia. Their rates carry the network label
    # "GA Blue Value HIX Individual Network". The index also links them to
    # about 250 out-of-state BlueCard shards, which list Georgia NPIs too; they
    # were ~40 GB of download that ended in a rollback, so they aren't named.
    exchange_networks:
      - "45334-GAN001"
    files:
      - "GA_JBNKMED0001.json.gz"
    network_patterns:
      - "GA Blue Value HIX*"

  - name: Anthem Pathway PCP Copay Choice
    payer: anthem
    # A second Georgia individual network, so the plan picker has a real choice.
    # Same index shape as Blue Value.
    exchange_networks:
      - "49046-GAN008"
    files:
      - "GA_JBLDMEDTR01.json.gz"
    network_patterns:
      - "Pathway PCP Copay Choice*"
    # Every provider group in the file carries a set of labels. Nearly all
    # carry the exchange specialist label below, and a part of them also carry
    # the plan's own. Hospitals' contracts sit on groups without the plan's own
    # label (decision 1 on #191), so the exchange labels are published too.
    # TRADITIONAL HEALTH PLAN and the program labels stay out because nothing
    # ties them to the exchange plan.
    shared_patterns:
      - "EXCHANGES SPECIALIST*GATEKEEPER*ON INDIVIDUAL"
      - "EXCHANGES PCP*GATEKEEPER*ON INDIVIDUAL"

  # Anthem's other two Georgia exchange networks. The index links each to two
  # files, one whose labels say ON INDIVIDUAL and one OFF; Georgia Access sells
  # the on-exchange plans, so each target names the ON file. Neither file carries
  # a label with the plan's name, only Anthem's exchange-wide labels, so those are
  # the network's own. The program labels (urgent care, retail clinics, military)
  # stay out, as above.
  - name: Anthem Pathway
    payer: anthem
    exchange_networks:
      - "49046-GAN001"
    files:
      - "GA_HXAHMED0001.json.gz"
    network_patterns:
      - "EXCHANGES PCP*ON INDIVIDUAL"
      - "EXCHANGES SPC HOSPITAL ANCILLARY*ON INDIVIDUAL"

  - name: Anthem Pathway Guided Access
    payer: anthem
    exchange_networks:
      - "49046-GAN003"
    files:
      - "GA_HYMJMED0001.json.gz"
    network_patterns:
      - "EXCHANGES SPECIALIST*GATEKEEPER*ON INDIVIDUAL"
      - "EXCHANGES PCP*GATEKEEPER*ON INDIVIDUAL"

  # Ambetter (Centene), Georgia's issuer 70893. One file prices all five of its
  # exchange networks, each under its own label, so five targets name the same
  # file, read once. The index lists Georgia's plans by 10-character product ID
  # (70893GA001), which covers every plan under it. The date in the name changes
  # monthly. "Exchange Solutions" is another Centene issuer's, not a target.
  - name: Ambetter Premier
    payer: ambetter
    exchange_networks:
      - "70893-GAN001"
    files:
      - "*_ambetter-ga_in-network.json"
    network_patterns:
      - "Exchange GA"

  - name: Ambetter Select Wellstar
    payer: ambetter
    exchange_networks:
      - "70893-GAN002"
    files:
      - "*_ambetter-ga_in-network.json"
    network_patterns:
      - "Exchange Select Wellstar"

  - name: Ambetter Select Plus
    payer: ambetter
    exchange_networks:
      - "70893-GAN003"
    files:
      - "*_ambetter-ga_in-network.json"
    network_patterns:
      - "Exchange Select Plus"

  - name: Ambetter Select St Joseph Chandler
    payer: ambetter
    exchange_networks:
      - "70893-GAN004"
    files:
      - "*_ambetter-ga_in-network.json"
    network_patterns:
      - "Exchange Select St Joseph Chandler"

  - name: Ambetter Select Gwinnett Clinic
    payer: ambetter
    exchange_networks:
      - "70893-GAN005"
    files:
      - "*_ambetter-ga_in-network.json"
    network_patterns:
      - "Exchange Select Gwinnett Clinic"

  # Alliant Health Plans, Georgia's issuer 83761. Two files, one per network. The
  # hoa file also prices Alliant's Tennessee plans (issuer 29854), whose
  # providers the Georgia NPI filter drops. The rosters are tax IDs and NPIs. The
  # index lists plan IDs with a two-digit variant after the 14 characters, and the
  # files list their rates before provider_references, so parse reads them from
  # disk in two passes (parse.md). The date in the name changes monthly.
  - name: Alliant Health Plans
    payer: alliant
    exchange_networks:
      - "83761-GAN001"
    files:
      - "*_alliant-health-plans_in-network-rates-individual_hoa.json"
    network_patterns:
      - "Alliant Health Plans"

  - name: Alliant Vitruvian Plus Care
    payer: alliant
    exchange_networks:
      - "83761-GAN002"
    files:
      - "*_alliant-health-plans_in-network-rates-individual_care.json"
    network_patterns:
      - "Vitruvian Plus Care"

  # Oscar Health, Georgia's issuer 58081. Two files, one per network, and the
  # index lists one product ID (58081GA001) for both, so each target names its
  # file and its exact label. The files list their rates before
  # provider_references, so parse reads them from disk in two passes (parse.md).
  # The Optum behavioral-health files and the Davis Vision file the index also
  # lists are other contracts, so no target names them. The date in the name
  # changes monthly.
  - name: Oscar Individual Georgia HMO
    payer: oscar
    exchange_networks:
      - "58081-GAN002"
    files:
      - "*-oscar-063-in-network.json"
    network_patterns:
      - "Individual Georgia HMO"

  - name: Oscar Individual Georgia HMO Non-Gatekept
    payer: oscar
    exchange_networks:
      - "58081-GAN001"
    files:
      - "*-oscar-065-in-network.json"
    network_patterns:
      - "Individual Georgia HMO Non-Gatekept"
