# Hospital price files: the hospitals whose own prices we read, and the payers
# whose rates in them we keep.
#
# CMS has every hospital publish a machine-readable file of its standard
# charges: its gross charge and cash price for each item, and the rate it has
# negotiated with each payer and plan. `etl hospital-rates` (`make reference
# STEP=hospital-rates`) downloads each file listed here and writes its rates to
# data/ingestion/hospital_rates/<ccn>.parquet (ingestion/etl/hospital-rates.md).
#
#   payers     Case-insensitive regular expressions. A rate whose payer name
#              matches one is kept, and every other payer's is dropped; an item
#              no kept payer prices keeps only its gross charge and cash price.
#
#   hospitals  One entry per hospital:
#                ccn       Its CMS Certification Number, quoted ("110010"), as
#                          hospitals_ga.parquet has it
#                          (ingestion/reference/hospitals.md). It names the
#                          output file.
#                name      Its everyday name, for the log.
#                index     Its system's cms-hpt.txt, at the root of the
#                          system's website, which lists each location's file.
#                location  Its location-name in that index, matched
#                          case-insensitively once trimmed.
#              or, for a hospital with no usable cms-hpt.txt, in place of
#              index and location:
#                url       The address of its price file.
#
# To add a hospital, find its location-name in its system's cms-hpt.txt and
# run `make reference STEP=hospital-rates ARGS="-only <ccn>"`.

payers:
  - anthem
  - 'blue ?cross'
  - bcbs

hospitals:
