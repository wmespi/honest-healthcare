# SPA fallback for the client-side router (#87) — nginx's default config only
# serves files that exist on disk, so a direct hit (bookmark, shared link,
# refresh) on a client-only route like /find-care/pcp 404s without this: no
# file at that path, only index.html + the router know it's a real route.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
