name: CI

on:
  pull_request:
    paths-ignore: &docs-only
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore: *docs-only

# One in-flight run per branch; a new push cancels the old run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip everything on draft PRs — CI resumes when the PR is marked ready.
# (push-to-main events have no pull_request context, so they always run.)
jobs:
  go:
    name: Go — fmt, vet, build, unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: etl/go.mod
          cache-dependency-path: etl/go.sum
      - name: gofmt (non-mutating check)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need 'make fmt':"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  web:
    name: Frontend — vitest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run

  integration:
    name: Serving + ETL (compose)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + start db, etl, serving
        run: |
          mkdir -p data data-test
          docker compose up -d --build db etl serving
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres -d honest_healthcare; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker compose logs db
          exit 1
      - name: Apply migrations (idempotent — keeps test.* in sync with public)
        run: make migrate
      - name: Serving — hermetic reference-builder tests
        run: |
          docker compose exec -T serving pip install -q pytest
          docker compose exec -T -w /app serving python -m pytest \
            serving/tests/test_cms_utilization.py \
            serving/tests/test_specialty_profiles.py -q
      - name: ETL e2e + NPPES fixtures
        run: make test-e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
