name: CI

on:
  pull_request:
    # default types + ready_for_review, so a draft PR's heavy jobs actually run
    # when it's marked ready (the `changes` job skips them while draft).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# One in-flight run per branch; a new push cancels the old run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `CI Gate` is the single required status check (branch protection). It always
# runs and passes only when every heavy job either succeeded or was legitimately
# skipped — a docs-only change or a draft PR. That keeps a pure-docs PR from
# deadlocking on checks that (by design) never start, without a `paths-ignore`
# that leaves required checks stuck "pending" forever.
jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
            echo "draft PR — skipping the heavy jobs until it's marked ready"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null; then
            range="$BEFORE...$AFTER"
          else
            echo "no usable diff base — running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$range")"
          echo "changed files:"; echo "$files"
          # docs-only = every changed path is a *.md, under docs/, or LICENSE
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code paths touched — running the full CI"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change — skipping the heavy jobs"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go — fmt, vet, build, unit tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: etl/go.mod
          cache-dependency-path: etl/go.sum
      - name: gofmt (non-mutating check)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need 'make fmt':"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  web:
    name: Frontend — vitest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run

  integration:
    name: Serving + ETL (compose)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build + start db, etl, serving
        run: |
          mkdir -p data data-test
          docker compose up -d --build db etl serving
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres -d honest_healthcare; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker compose logs db
          exit 1
      - name: Apply migrations (idempotent — keeps test.* in sync with public)
        run: make migrate
      - name: Serving — hermetic contract + reference-builder tests
        run: |
          docker compose exec -T serving pip install -q -r /app/serving/requirements-dev.txt
          docker compose exec -T -w /app serving python -m pytest \
            serving/tests/test_api_contract.py \
            serving/tests/test_cms_utilization.py \
            serving/tests/test_specialty_profiles.py \
            serving/tests/test_mpfs.py -q
      - name: Golden-answer tests (#96) — real API, empty data/ here, must skip not fail
        run: |
          docker compose exec -T -w /app serving python -m pytest serving/tests/test_golden.py -v
      - name: ETL e2e + NPPES fixtures
        run: make test-e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  images:
    name: Production images build + smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the prod image targets
        run: |
          docker build -f deploy/Dockerfile.etl      --target prod -t hh-etl:ci .
          docker build -f deploy/Dockerfile.serving                -t hh-serving:ci .
          docker build -f deploy/Dockerfile.frontend --target prod -t hh-frontend:ci .
      - name: Smoke — etl binary runs
        run: docker run --rm hh-etl:ci --help | grep -q "discover"
      - name: Smoke — serving answers /
        run: |
          docker run -d --name hh_serving_smoke -p 8000:8000 hh-serving:ci
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { docker logs hh_serving_smoke; exit 1; }
      - name: Smoke — frontend serves index.html
        run: |
          docker run -d --name hh_frontend_smoke -p 8080:80 hh-frontend:ci
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { docker logs hh_frontend_smoke; exit 1; }

  gate:
    name: CI Gate
    needs: [changes, go, web, integration, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an upstream job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "all upstream jobs passed or were intentionally skipped"
