name: CI

on:
  pull_request:
    # default types + ready_for_review, so a draft PR's heavy jobs actually run
    # when it's marked ready (the `changes` job skips them while draft).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# One in-flight run per branch; a new push cancels the old run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `CI Gate` is the single required status check (branch protection). It always
# runs and passes only when every heavy job either succeeded or was legitimately
# skipped — a docs-only change or a draft PR. That keeps a pure-docs PR from
# deadlocking on checks that (by design) never start, without a `paths-ignore`
# that leaves required checks stuck "pending" forever.
jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs drift check (links, make targets, paths)
        run: python3 scripts/check_docs.py
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
            echo "draft PR — skipping the heavy jobs until it's marked ready"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null; then
            range="$BEFORE...$AFTER"
          else
            echo "no usable diff base — running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$range")"
          echo "changed files:"; echo "$files"
          # docs-only = every changed path is a *.md, under docs/, or LICENSE
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code paths touched — running the full CI"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change — skipping the heavy jobs"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go — fmt, vet, build, unit tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion/etl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion/etl/go.mod
          cache-dependency-path: ingestion/etl/go.sum
      - name: gofmt (non-mutating check)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt (run 'make check'):"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  web:
    name: Frontend — vitest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run

  layers:
    name: Layers + ETL e2e (compose)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build + start ingestion, integration, serving
        run: |
          # Made by the runner's user, so the e2e tests can write into them from the host.
          mkdir -p data/raw data/ingestion data/serving data-test/raw data-test/ingestion data-test/serving
          docker compose up -d --build ingestion integration serving
      - name: ETL e2e, then each layer's tests in its own container, as make test runs them
        run: make _test-layers
      - name: Golden-answer tests (#96) — real API, empty data/ here, must skip not fail
        run: |
          docker compose exec -T serving python3 -m pytest tests/live -v
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  images:
    name: Production images build + smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the prod image targets
        run: |
          docker build --target prod          -t hh-ingestion:ci   ingestion
          docker build --target prod          -t hh-integration:ci integration
          docker build --target serving-prod  -t hh-serving:ci     application
          docker build --target frontend-prod -t hh-frontend:ci    application
      - name: Smoke - ingestion's etl binary and Python steps run
        run: |
          docker run --rm hh-ingestion:ci etl --help 2>&1 | grep -q "discover"
          docker run --rm -w /app hh-ingestion:ci python3 -m ingestion.anthem_rates --help | grep -q "targets"
      - name: Smoke - integration stops on a missing input, naming the step that makes it
        run: |
          # No data/ is mounted, so the build has nothing to read and must say so.
          if out=$(docker run --rm hh-integration:ci 2>&1); then
            echo "the build ran with no inputs"; echo "$out"; exit 1
          fi
          echo "$out" | grep -q "no /app/data/ingestion/payer_rates/" || { echo "$out"; exit 1; }
      - name: Smoke — serving answers /
        run: |
          # No data/ is mounted here, so there's no serving-table build for the
          # app to read — GET / correctly answers 503 (#100: a missing build is
          # an explicit error, not a silent fallback). The smoke check confirms
          # the container starts and answers with a well-formed health payload,
          # not that it has data; 200 (a build present) is also accepted so
          # this doesn't need updating if that ever changes here.
          docker run -d --name hh_serving_smoke -p 8000:8000 hh-serving:ci
          for _ in $(seq 1 20); do
            code=$(curl -s -o /tmp/smoke_body.json -w '%{http_code}' http://localhost:8000/ || true)
            case "$code" in 200|503) break ;; esac
            sleep 1
          done
          case "$code" in
            200) ;;
            503) grep -q '"missing"' /tmp/smoke_body.json || { echo "503 without a 'missing' field"; cat /tmp/smoke_body.json; docker logs hh_serving_smoke; exit 1; } ;;
            *) echo "unexpected status $code"; cat /tmp/smoke_body.json 2>/dev/null; docker logs hh_serving_smoke; exit 1 ;;
          esac
      - name: Smoke — frontend serves index.html
        run: |
          docker run -d --name hh_frontend_smoke -p 8080:80 hh-frontend:ci
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { docker logs hh_frontend_smoke; exit 1; }

  gate:
    name: CI Gate
    needs: [changes, go, web, layers, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an upstream job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "all upstream jobs passed or were intentionally skipped"
